[pytest]
# tests/ 里有 5 个"脚本式"文件（没有任何 def test_ 函数，靠顶层代码直接执行）：
#   test_parse.py / test_resume.py / test_run.py / test_run_fc.py / test_run_persistent.py
#
# pytest 收集时会 import 这些模块，于是顶层代码被真的执行：
#   - test_run*.py 会真的调用 DeepSeek API 并写真实 agent.db；
#   - test_resume.py 会直接删改真实 agent.db 的数据。
# 这会让"跑一遍单元测试"产生 API 费用和数据污染，所以在 pytest 里排除它们。
#
# 需要单独运行时照旧直接跑脚本：python tests/test_run_persistent.py
addopts =
    --ignore=tests/test_parse.py
    --ignore=tests/test_resume.py
    --ignore=tests/test_run.py
    --ignore=tests/test_run_fc.py
    --ignore=tests/test_run_persistent.py
